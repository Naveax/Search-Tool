name: windows-long-soak

run-name: 6h long soak on main by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      drive:
        description: NTFS volume to mutate during the soak
        required: true
        default: 'C:'
        type: string
      index:
        description: Full path to the matching volume .stidx file on the self-hosted runner
        required: true
        type: string
      service_name:
        description: Installed Search Tool service that owns the requested index
        required: true
        default: 'SearchToolIndexer'
        type: string
      crash_restart:
        description: Intentionally crash/restart the service once at mid-run
        required: true
        default: true
        type: boolean
      confirmation:
        description: Type LONG-SOAK to confirm destructive six-hour physical validation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-long-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  long-soak:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 500
    env:
      SOAK_MINUTES: '360'
      SOAK_DRIVE: ${{ inputs.drive }}
      SOAK_INDEX: ${{ inputs.index }}
      SOAK_SERVICE: ${{ inputs.service_name }}
      SOAK_CRASH_RESTART: ${{ inputs.crash_restart }}
      SOAK_CONFIRMATION: ${{ inputs.confirmation }}
      DURABLE_EVIDENCE_DIR: C:\SearchToolLab\evidence
    steps:
      - name: Safety confirmation
        shell: pwsh
        run: |
          if ($env:SOAK_CONFIRMATION -cne 'LONG-SOAK') {
            throw 'Refusing long soak: confirmation must be exactly LONG-SOAK.'
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Build and source validation
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace --release

      - name: Verify physical target ownership and acquire intent lock
        shell: pwsh
        run: |
          if ($env:SOAK_DRIVE -notmatch '^[A-Za-z]:
      - name: Launch detached physical soak
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-raw-$env:GITHUB_RUN_ID.json")
          $sealed = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-$env:GITHUB_RUN_ID.json")
          $exitFile = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-exit-$env:GITHUB_RUN_ID.txt")
          $pidFile = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-pid-$env:GITHUB_RUN_ID.txt")
          $wrapper = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-worker-$env:GITHUB_RUN_ID.ps1")

          foreach ($path in @($raw, $sealed, $exitFile, $pidFile, $wrapper)) {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }

          @'
          $ErrorActionPreference = 'Stop'
          $exitCode = 1
          try {
              $params = @{
                  Drive = $env:SOAK_DRIVE
                  Index = $env:SOAK_INDEX
                  ServiceName = $env:SOAK_SERVICE
                  DurationMinutes = [int]$env:SOAK_MINUTES
                  PollTimeoutSeconds = 120
                  OutputJson = $env:LONG_SOAK_RAW
              }
              if ($env:SOAK_CRASH_RESTART -eq 'true') {
                  $params['CrashRestartService'] = $true
              }
              & (Join-Path $env:GITHUB_WORKSPACE 'scripts\windows-soak.ps1') @params
              $exitCode = 0
          } catch {
              [Console]::Error.WriteLine($_.Exception.ToString())
              $exitCode = 1
          } finally {
              [IO.File]::WriteAllText($env:LONG_SOAK_EXIT_FILE, [string]$exitCode)
          }
          exit $exitCode
          '@ | Set-Content -LiteralPath $wrapper -Encoding UTF8

          $env:LONG_SOAK_RAW = $raw
          $env:LONG_SOAK_EXIT_FILE = $exitFile

          "LONG_SOAK_RAW=$raw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_EVIDENCE=$sealed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_EXIT_FILE=$exitFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_PID_FILE=$pidFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$wrapper`""
          $proc = Start-Process -FilePath powershell.exe -ArgumentList $arguments -PassThru -WindowStyle Hidden
          [IO.File]::WriteAllText($pidFile, [string]$proc.Id)
          Start-Sleep -Seconds 2
          if (-not (Test-Path -LiteralPath $exitFile) -and -not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
            throw "Long-soak worker exited before startup validation: pid=$($proc.Id)"
          }
          Write-Host "LONG_SOAK_STARTED pid=$($proc.Id) raw=$raw"

      - name: Monitor soak first five hours
        shell: pwsh
        timeout-minutes: 305
        run: |
          $deadline = (Get-Date).AddMinutes(300)
          do {
            if (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE) { exit 0 }
            $pidValue = [int](Get-Content -LiteralPath $env:LONG_SOAK_PID_FILE -Raw)
            if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) {
              throw "Long-soak worker disappeared without an exit marker: pid=$pidValue"
            }
            Start-Sleep -Seconds 20
          } while ((Get-Date) -lt $deadline)
          Write-Host 'LONG_SOAK_STILL_RUNNING elapsed_monitor_minutes=300'

      - name: Monitor soak completion
        if: success()
        shell: pwsh
        timeout-minutes: 155
        run: |
          if (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE) { exit 0 }
          $deadline = (Get-Date).AddMinutes(150)
          do {
            if (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE) { exit 0 }
            $pidValue = [int](Get-Content -LiteralPath $env:LONG_SOAK_PID_FILE -Raw)
            if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) {
              throw "Long-soak worker disappeared without an exit marker: pid=$pidValue"
            }
            Start-Sleep -Seconds 20
          } while ((Get-Date) -lt $deadline)
          throw 'Six-hour soak did not finish within the 7.5-hour worker budget.'

      - name: Validate worker exit
        if: success()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE)) {
            throw 'Long-soak worker did not produce an exit marker.'
          }
          $code = [int](Get-Content -LiteralPath $env:LONG_SOAK_EXIT_FILE -Raw)
          if ($code -ne 0) {
            throw "Long-soak worker failed with exit code $code."
          }

      - name: Stop orphan worker
        if: always()
        shell: pwsh
        run: |
          if ($env:LONG_SOAK_PID_FILE -and
              (Test-Path -LiteralPath $env:LONG_SOAK_PID_FILE) -and
              -not ($env:LONG_SOAK_EXIT_FILE -and (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE))) {
            $pidValue = [int](Get-Content -LiteralPath $env:LONG_SOAK_PID_FILE -Raw)
            $info = Get-CimInstance Win32_Process -Filter "ProcessId=$pidValue" -ErrorAction SilentlyContinue
            if ($info) {
              $expectedWrapper = "search-tool-long-soak-worker-$env:GITHUB_RUN_ID.ps1"
              if ([string]$info.CommandLine -notlike "*$expectedWrapper*") {
                throw "Refusing to stop PID $pidValue because it no longer belongs to this long-soak worker."
              }
              Write-Warning "Stopping unfinished long-soak worker pid=$pidValue"
              Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
              $deadline = (Get-Date).AddSeconds(15)
              do {
                if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) { break }
                Start-Sleep -Milliseconds 250
              } while ((Get-Date) -lt $deadline)
              if (Get-Process -Id $pidValue -ErrorAction SilentlyContinue) {
                throw "Could not stop orphan long-soak worker: pid=$pidValue"
              }
            }
          }

      - name: Seal evidence with source identity
        if: always()
        shell: pwsh
        run: |
          $raw = $null
          if ($env:LONG_SOAK_RAW -and (Test-Path -LiteralPath $env:LONG_SOAK_RAW)) {
            $raw = Get-Content -LiteralPath $env:LONG_SOAK_RAW -Raw | ConvertFrom-Json
          }
          $workerExit = $null
          if ($env:LONG_SOAK_EXIT_FILE -and (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE)) {
            $workerExit = [int](Get-Content -LiteralPath $env:LONG_SOAK_EXIT_FILE -Raw)
          }
          $evidencePath = if ($env:LONG_SOAK_EVIDENCE) {
            $env:LONG_SOAK_EVIDENCE
          } else {
            Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-$env:GITHUB_RUN_ID.json")
          }
          $evidence = [ordered]@{
            schema = 1
            intent_sha256 = $env:LONG_SOAK_INTENT_SHA
            source_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            requested_duration_minutes = [int]$env:SOAK_MINUTES
            drive = $env:SOAK_DRIVE
            index = $env:SOAK_INDEX
            service_name = $env:SOAK_SERVICE
            crash_restart_requested = ($env:SOAK_CRASH_RESTART -eq 'true')
            worker_exit_code = $workerExit
            sealed_utc = [DateTime]::UtcNow.ToString('o')
            soak = $raw
            result = if ($workerExit -eq 0 -and $raw -and $raw.result -eq 'PASS') {
              'PASS'
            } elseif ($raw -and $raw.result) {
              [string]$raw.result
            } else {
              'INCOMPLETE'
            }
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $evidencePath -Encoding UTF8

          New-Item -ItemType Directory -Force -Path $env:DURABLE_EVIDENCE_DIR | Out-Null
          $durable = Join-Path $env:DURABLE_EVIDENCE_DIR ("long-soak-run-$env:GITHUB_RUN_ID.json")
          Copy-Item -LiteralPath $evidencePath -Destination $durable -Force
          Write-Host "DurableRunEvidence=$durable"

          if ($evidence.result -eq 'PASS') {
            if (-not $env:LONG_SOAK_COMPLETE) { throw 'Missing durable completion path.' }
            Copy-Item -LiteralPath $evidencePath -Destination $env:LONG_SOAK_COMPLETE
            if ($env:LONG_SOAK_LOCK -and (Test-Path -LiteralPath $env:LONG_SOAK_LOCK)) {
              Remove-Item -LiteralPath $env:LONG_SOAK_LOCK -Force
            }
            Write-Host "DurableCompletionEvidence=$env:LONG_SOAK_COMPLETE"
          } else {
            Write-Warning "Long-soak lock is intentionally retained for recovery: $env:LONG_SOAK_LOCK"
          }

      - name: Upload long-soak evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SearchTool-long-soak-${{ github.run_id }}
          path: ${{ runner.temp }}/search-tool-long-soak-${{ github.run_id }}.json
          if-no-files-found: warn
) {
            throw "Invalid drive input: $env:SOAK_DRIVE"
          }
          if (-not (Test-Path -LiteralPath $env:SOAK_INDEX -PathType Leaf)) {
            throw "Requested index does not exist: $env:SOAK_INDEX"
          }
          $resolvedIndex = (Resolve-Path -LiteralPath $env:SOAK_INDEX).Path
          $svc = Get-Service -Name $env:SOAK_SERVICE -ErrorAction Stop
          if ($svc.Status -ne 'Running') {
            throw "Requested service is not Running: $env:SOAK_SERVICE status=$($svc.Status)"
          }

          New-Item -ItemType Directory -Force -Path $env:DURABLE_EVIDENCE_DIR | Out-Null
          $intent = "$env:GITHUB_SHA|$env:SOAK_MINUTES|$($env:SOAK_DRIVE.ToUpperInvariant())|$resolvedIndex|$env:SOAK_SERVICE|$env:SOAK_CRASH_RESTART"
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $hash = $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($intent))
          } finally {
            $sha.Dispose()
          }
          $intentSha = -join ($hash | ForEach-Object { $_.ToString('x2') })
          $lockPath = Join-Path $env:DURABLE_EVIDENCE_DIR ("long-soak-$intentSha.lock")
          $completePath = Join-Path $env:DURABLE_EVIDENCE_DIR ("long-soak-$intentSha.json")

          if (Test-Path -LiteralPath $completePath) {
            throw "Equivalent long soak already has durable evidence: $completePath"
          }
          if (Test-Path -LiteralPath $lockPath) {
            throw "Equivalent long soak has an existing lock. Recover/inspect it instead of retrying: $lockPath"
          }

          $lockInfo = [ordered]@{
            schema = 1
            intent_sha256 = $intentSha
            source_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            drive = $env:SOAK_DRIVE
            index = $resolvedIndex
            service_name = $env:SOAK_SERVICE
            duration_minutes = [int]$env:SOAK_MINUTES
            crash_restart = ($env:SOAK_CRASH_RESTART -eq 'true')
            created_utc = [DateTime]::UtcNow.ToString('o')
          }
          $lockJson = $lockInfo | ConvertTo-Json -Depth 5
          $stream = [IO.File]::Open($lockPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try {
            $writer = [IO.StreamWriter]::new($stream, [Text.UTF8Encoding]::new($false))
            try { $writer.Write($lockJson) } finally { $writer.Dispose() }
          } finally {
            if ($stream) { $stream.Dispose() }
          }

          "SOAK_INDEX=$resolvedIndex" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_INTENT_SHA=$intentSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_LOCK=$lockPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_COMPLETE=$completePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LONG_SOAK_TARGET drive=$env:SOAK_DRIVE index=$resolvedIndex service=$env:SOAK_SERVICE minutes=$env:SOAK_MINUTES sha=$env:GITHUB_SHA intent=$intentSha"

      - name: Launch detached physical soak
        shell: pwsh
        run: |
          $raw = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-raw-$env:GITHUB_RUN_ID.json")
          $sealed = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-$env:GITHUB_RUN_ID.json")
          $exitFile = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-exit-$env:GITHUB_RUN_ID.txt")
          $pidFile = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-pid-$env:GITHUB_RUN_ID.txt")
          $wrapper = Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-worker-$env:GITHUB_RUN_ID.ps1")

          foreach ($path in @($raw, $sealed, $exitFile, $pidFile, $wrapper)) {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }

          @'
          $ErrorActionPreference = 'Stop'
          $exitCode = 1
          try {
              $params = @{
                  Drive = $env:SOAK_DRIVE
                  Index = $env:SOAK_INDEX
                  ServiceName = $env:SOAK_SERVICE
                  DurationMinutes = [int]$env:SOAK_MINUTES
                  PollTimeoutSeconds = 120
                  OutputJson = $env:LONG_SOAK_RAW
              }
              if ($env:SOAK_CRASH_RESTART -eq 'true') {
                  $params['CrashRestartService'] = $true
              }
              & (Join-Path $env:GITHUB_WORKSPACE 'scripts\windows-soak.ps1') @params
              $exitCode = 0
          } catch {
              Write-Error $_
              $exitCode = 1
          } finally {
              [IO.File]::WriteAllText($env:LONG_SOAK_EXIT_FILE, [string]$exitCode)
          }
          exit $exitCode
          '@ | Set-Content -LiteralPath $wrapper -Encoding UTF8

          $env:LONG_SOAK_RAW = $raw
          $env:LONG_SOAK_EXIT_FILE = $exitFile

          "LONG_SOAK_RAW=$raw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_EVIDENCE=$sealed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_EXIT_FILE=$exitFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LONG_SOAK_PID_FILE=$pidFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$wrapper`""
          $proc = Start-Process -FilePath powershell.exe -ArgumentList $arguments -PassThru -WindowStyle Hidden
          [IO.File]::WriteAllText($pidFile, [string]$proc.Id)
          Start-Sleep -Seconds 2
          if (-not (Test-Path -LiteralPath $exitFile) -and -not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
            throw "Long-soak worker exited before startup validation: pid=$($proc.Id)"
          }
          Write-Host "LONG_SOAK_STARTED pid=$($proc.Id) raw=$raw"

      - name: Monitor soak first five hours
        shell: pwsh
        timeout-minutes: 305
        run: |
          $deadline = (Get-Date).AddMinutes(300)
          do {
            if (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE) { exit 0 }
            $pidValue = [int](Get-Content -LiteralPath $env:LONG_SOAK_PID_FILE -Raw)
            if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) {
              throw "Long-soak worker disappeared without an exit marker: pid=$pidValue"
            }
            Start-Sleep -Seconds 20
          } while ((Get-Date) -lt $deadline)
          Write-Host 'LONG_SOAK_STILL_RUNNING elapsed_monitor_minutes=300'

      - name: Monitor soak completion
        if: success()
        shell: pwsh
        timeout-minutes: 155
        run: |
          if (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE) { exit 0 }
          $deadline = (Get-Date).AddMinutes(150)
          do {
            if (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE) { exit 0 }
            $pidValue = [int](Get-Content -LiteralPath $env:LONG_SOAK_PID_FILE -Raw)
            if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) {
              throw "Long-soak worker disappeared without an exit marker: pid=$pidValue"
            }
            Start-Sleep -Seconds 20
          } while ((Get-Date) -lt $deadline)
          throw 'Six-hour soak did not finish within the 7.5-hour worker budget.'

      - name: Validate worker exit
        if: success()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE)) {
            throw 'Long-soak worker did not produce an exit marker.'
          }
          $code = [int](Get-Content -LiteralPath $env:LONG_SOAK_EXIT_FILE -Raw)
          if ($code -ne 0) {
            throw "Long-soak worker failed with exit code $code."
          }

      - name: Stop orphan worker
        if: always()
        shell: pwsh
        run: |
          if ($env:LONG_SOAK_PID_FILE -and (Test-Path -LiteralPath $env:LONG_SOAK_PID_FILE)) {
            $pidValue = [int](Get-Content -LiteralPath $env:LONG_SOAK_PID_FILE -Raw)
            $proc = Get-Process -Id $pidValue -ErrorAction SilentlyContinue
            if ($proc) {
              Write-Warning "Stopping unfinished long-soak worker pid=$pidValue"
              Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
              $deadline = (Get-Date).AddSeconds(15)
              do {
                if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) { break }
                Start-Sleep -Milliseconds 250
              } while ((Get-Date) -lt $deadline)
              if (Get-Process -Id $pidValue -ErrorAction SilentlyContinue) {
                throw "Could not stop orphan long-soak worker: pid=$pidValue"
              }
            }
          }

      - name: Seal evidence with source identity
        if: always()
        shell: pwsh
        run: |
          $raw = $null
          if ($env:LONG_SOAK_RAW -and (Test-Path -LiteralPath $env:LONG_SOAK_RAW)) {
            $raw = Get-Content -LiteralPath $env:LONG_SOAK_RAW -Raw | ConvertFrom-Json
          }
          $workerExit = $null
          if ($env:LONG_SOAK_EXIT_FILE -and (Test-Path -LiteralPath $env:LONG_SOAK_EXIT_FILE)) {
            $workerExit = [int](Get-Content -LiteralPath $env:LONG_SOAK_EXIT_FILE -Raw)
          }
          $evidencePath = if ($env:LONG_SOAK_EVIDENCE) {
            $env:LONG_SOAK_EVIDENCE
          } else {
            Join-Path $env:RUNNER_TEMP ("search-tool-long-soak-$env:GITHUB_RUN_ID.json")
          }
          $evidence = [ordered]@{
            schema = 1
            source_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            requested_duration_minutes = [int]$env:SOAK_MINUTES
            drive = $env:SOAK_DRIVE
            index = $env:SOAK_INDEX
            service_name = $env:SOAK_SERVICE
            crash_restart_requested = ($env:SOAK_CRASH_RESTART -eq 'true')
            worker_exit_code = $workerExit
            sealed_utc = [DateTime]::UtcNow.ToString('o')
            soak = $raw
            result = if ($workerExit -eq 0 -and $raw -and $raw.result -eq 'PASS') {
              'PASS'
            } elseif ($raw -and $raw.result) {
              [string]$raw.result
            } else {
              'INCOMPLETE'
            }
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $evidencePath -Encoding UTF8

          New-Item -ItemType Directory -Force -Path $env:DURABLE_EVIDENCE_DIR | Out-Null
          $durable = Join-Path $env:DURABLE_EVIDENCE_DIR ("long-soak-$env:GITHUB_RUN_ID.json")
          Copy-Item -LiteralPath $evidencePath -Destination $durable -Force
          Write-Host "DurableEvidence=$durable"

      - name: Upload long-soak evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SearchTool-long-soak-${{ github.run_id }}
          path: ${{ runner.temp }}/search-tool-long-soak-${{ github.run_id }}.json
          if-no-files-found: warn
