name: web-resolver-live-validation

on:
  push:
    branches: [probe-web-resolver-live-20261001]
    paths:
      - '.github/workflows/web-resolver-live-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Build Search Tool CLI
        shell: pwsh
        run: cargo build --release -p search-tool-cli
      - name: Run live Web Resolver validation
        id: validate
        shell: pwsh
        env:
          SEARCH_TOOL_GOOGLE_KEY: ${{ secrets.SEARCH_TOOL_GOOGLE_KEY }}
          SEARCH_TOOL_GOOGLE_CX: ${{ secrets.SEARCH_TOOL_GOOGLE_CX }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'web-resolver-live.json'
          .\scripts\web-resolver-validation.ps1 -Cli .\target\release\search-tool.exe -OutputJson $report
          $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          Write-Host "WEB_RESOLVER_RESULT=$($data.result)"
          Write-Host 'REPORT_BEGIN'
          Get-Content -LiteralPath $report -Raw | Write-Host
          Write-Host 'REPORT_END'
          if ($data.result -eq 'FAIL') {
            throw 'Credential-backed Web Resolver validation returned FAIL.'
          }
          if ($data.result -eq 'PASS') {
            $dest = Join-Path $PWD 'docs\evidence\web-resolver-live-${{ github.run_id }}.json'
            Copy-Item -LiteralPath $report -Destination $dest -Force
          }
      - name: Commit PASS evidence to probe branch
        if: success()
        shell: pwsh
        run: |
          $evidence = Get-ChildItem -LiteralPath .\docs\evidence -Filter 'web-resolver-live-*.json' -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $evidence) {
            Write-Host 'No PASS evidence to commit.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $evidence.FullName
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No evidence diff.'
            exit 0
          }
          git commit -m 'Record live Web Resolver validation evidence'
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-resolver-live-validation
          path: ${{ runner.temp }}/web-resolver-live.json
          if-no-files-found: warn
