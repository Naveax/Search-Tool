name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PowerShell syntax gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in @($parseErrors)) {
              $failures += "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PowerShell syntax gate PASS"
      - name: Release-state consistency gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\release-state-check.ps1
      - name: Release-state fail-closed self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\release-state-selftest.ps1
      - name: External validation orchestrator smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP 'SearchToolExternalValidationSmoke'
          $summary = Join-Path $outDir 'summary.json'
          .\.github\scripts\external-validation-orchestrator.ps1 `
            -SkipDefender `
            -SkipSmartScreen `
            -SkipDisplay `
            -SkipWebResolver `
            -OutputDir $outDir `
            -OutputJson $summary
          $report = Get-Content -LiteralPath $summary -Raw | ConvertFrom-Json
          if ([string]$report.result -ne 'PARTIAL') {
            throw "Expected PARTIAL orchestrator smoke result, got: $($report.result)"
          }
          if ([int]$report.counts.skipped -ne 4 -or [int]$report.counts.failed -ne 0) {
            throw "Unexpected orchestrator smoke counts: $($report.counts | ConvertTo-Json -Compress)"
          }

          $savedKey = $env:SEARCH_TOOL_GOOGLE_KEY
          $savedCx = $env:SEARCH_TOOL_GOOGLE_CX
          try {
            $env:SEARCH_TOOL_GOOGLE_KEY = $null
            $env:SEARCH_TOOL_GOOGLE_CX = $null
            $credentialDir = Join-Path $env:RUNNER_TEMP 'SearchToolExternalValidationCredentialSmoke'
            $credentialSummary = Join-Path $credentialDir 'summary.json'
            $missingCli = Join-Path $env:RUNNER_TEMP 'definitely-missing-search-tool.exe'
            .\.github\scripts\external-validation-orchestrator.ps1 `
              -SkipDefender `
              -SkipSmartScreen `
              -SkipDisplay `
              -Cli $missingCli `
              -OutputDir $credentialDir `
              -OutputJson $credentialSummary
            $credentialReport = Get-Content -LiteralPath $credentialSummary -Raw | ConvertFrom-Json
            if ([string]$credentialReport.result -ne 'BLOCKED') {
              throw "Expected BLOCKED credential preflight result, got: $($credentialReport.result)"
            }
            if ([int]$credentialReport.counts.blocked -ne 1 -or
                [int]$credentialReport.counts.skipped -ne 3 -or
                [int]$credentialReport.counts.failed -ne 0) {
              throw "Unexpected credential preflight counts: $($credentialReport.counts | ConvertTo-Json -Compress)"
            }
            $webGate = @($credentialReport.gates | Where-Object { $_.name -eq 'web_resolver' })
            if ($webGate.Count -ne 1 -or [string]$webGate[0].result -ne 'BLOCKED') {
              throw 'Expected exactly one BLOCKED Web Resolver gate.'
            }
            if ([bool]$webGate[0].report.credentials.google_key_present -or
                [bool]$webGate[0].report.credentials.google_cx_present) {
              throw 'Credential preflight unexpectedly reported a Google credential as present.'
            }
            if ([string]$webGate[0].reason -notmatch 'SEARCH_TOOL_GOOGLE_KEY') {
              throw "Credential preflight reported the wrong blocker reason: $($webGate[0].reason)"
            }
          } finally {
            $env:SEARCH_TOOL_GOOGLE_KEY = $savedKey
            $env:SEARCH_TOOL_GOOGLE_CX = $savedCx
          }

          $defenderDir = Join-Path $env:RUNNER_TEMP 'SearchToolExternalValidationDefenderReadinessSmoke'
          $defenderSummary = Join-Path $defenderDir 'summary.json'
          $missingDefenderCli = Join-Path $env:RUNNER_TEMP 'missing-release-dir\search-tool.exe'
          .\.github\scripts\external-validation-orchestrator.ps1 `
            -DefenderCustomScan:$false `
            -SkipSmartScreen `
            -SkipDisplay `
            -SkipWebResolver `
            -Cli $missingDefenderCli `
            -OutputDir $defenderDir `
            -OutputJson $defenderSummary
          $defenderAggregate = Get-Content -LiteralPath $defenderSummary -Raw | ConvertFrom-Json
          $defenderGate = @($defenderAggregate.gates | Where-Object { $_.name -eq 'defender' })
          if ($defenderGate.Count -ne 1) {
            throw 'Expected exactly one Defender gate.'
          }
          if ([string]$defenderGate[0].result -eq 'SKIPPED') {
            throw 'Defender readiness smoke unexpectedly skipped the Defender validator.'
          }
          if ([string]$defenderGate[0].reason -match 'Release binary directory is missing') {
            throw "Defender readiness incorrectly depended on the release binary directory: $($defenderGate[0].reason)"
          }
          if ([string]::IsNullOrWhiteSpace([string]$defenderGate[0].report_path) -or $null -eq $defenderGate[0].report) {
            throw 'Defender readiness did not reach the Defender validator/report path.'
          }
          $expectedDefenderPath = (Resolve-Path -LiteralPath '.').Path
          if ([IO.Path]::GetFullPath([string]$defenderGate[0].report.path) -ne [IO.Path]::GetFullPath($expectedDefenderPath)) {
            throw "Defender readiness used the wrong probe path: $($defenderGate[0].report.path)"
          }

          Write-Host 'External validation orchestrator smoke PASS'
      - name: Defender hosted active-protection activation probe
        if: runner.os == 'Windows' && github.head_ref == 'defender-hosted-activation-probe'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path $env:RUNNER_TEMP 'SearchToolDefenderHostedActivationProbe'
          Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
          $outerZip = Join-Path $probeRoot 'release-artifact.zip'
          $artifactDir = Join-Path $probeRoot 'artifact'
          $candidateDir = Join-Path $probeRoot 'candidate'
          $defenderReportPath = Join-Path $probeRoot 'defender-report.json'
          $summaryPath = Join-Path $probeRoot 'summary.json'
          $expectedSha = '0A48E17886874CD692206B2424A5F0459A683C75FE2FE0DE8A821030950E8E65'
          $expectedBytes = 1888674

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest `
            -Headers $headers `
            -Uri 'https://api.github.com/repos/Naveax/Search-Tool/actions/artifacts/11154482728/zip' `
            -OutFile $outerZip
          Expand-Archive -LiteralPath $outerZip -DestinationPath $artifactDir -Force
          $candidate = @(Get-ChildItem -LiteralPath $artifactDir -Recurse -File -Filter 'SearchTool-Windows-x64.zip') | Select-Object -First 1
          if ($null -eq $candidate) { throw 'Canonical SearchTool-Windows-x64.zip was not found in release-gate artifact.' }
          $candidateHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate.FullName).Hash.ToUpperInvariant()
          if ($candidateHash -ne $expectedSha -or [int64]$candidate.Length -ne $expectedBytes) {
            throw "Canonical candidate identity mismatch: bytes=$($candidate.Length) sha256=$candidateHash"
          }
          Expand-Archive -LiteralPath $candidate.FullName -DestinationPath $candidateDir -Force

          $beforeStatus = Get-MpComputerStatus
          $beforePreference = Get-MpPreference
          $attempts = [System.Collections.Generic.List[object]]::new()
          $restoreAttempts = [System.Collections.Generic.List[object]]::new()
          $scanException = $null
          $defenderReport = $null

          function Invoke-PreferenceChange {
            param([string]$Name, [scriptblock]$Action, [System.Collections.Generic.List[object]]$Sink)
            try {
              & $Action
              $Sink.Add([ordered]@{ name = $Name; success = $true; error = $null })
            } catch {
              $Sink.Add([ordered]@{ name = $Name; success = $false; error = [string]$_.Exception.Message })
            }
          }

          try {
            Invoke-PreferenceChange 'DisableRealtimeMonitoring=false' { Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop } $attempts
            Invoke-PreferenceChange 'DisableBehaviorMonitoring=false' { Set-MpPreference -DisableBehaviorMonitoring $false -ErrorAction Stop } $attempts
            Invoke-PreferenceChange 'DisableIOAVProtection=false' { Set-MpPreference -DisableIOAVProtection $false -ErrorAction Stop } $attempts
            Invoke-PreferenceChange 'DisableScriptScanning=false' { Set-MpPreference -DisableScriptScanning $false -ErrorAction Stop } $attempts
            Start-Sleep -Seconds 8

            $afterStatus = Get-MpComputerStatus
            $active = [bool]$afterStatus.AMServiceEnabled -and
              [bool]$afterStatus.AntivirusEnabled -and
              [bool]$afterStatus.RealTimeProtectionEnabled -and
              [bool]$afterStatus.BehaviorMonitorEnabled -and
              [bool]$afterStatus.AntispywareEnabled

            try {
              if ($active) {
                .\scripts\defender-check.ps1 -Path $candidateDir -CustomScan -OutputJson $defenderReportPath
              } else {
                .\scripts\defender-check.ps1 -Path $candidateDir -OutputJson $defenderReportPath
              }
            } catch {
              $scanException = [string]$_.Exception.Message
            }
            if (Test-Path -LiteralPath $defenderReportPath) {
              $defenderReport = Get-Content -LiteralPath $defenderReportPath -Raw | ConvertFrom-Json
            }

            $result = if (-not $active) {
              'BLOCKED'
            } elseif ($null -ne $defenderReport -and [string]$defenderReport.result -eq 'PASS' -and -not $scanException) {
              'PASS'
            } else {
              'FAIL'
            }

            $summary = [ordered]@{
              schema = 1
              timestamp_utc = [DateTime]::UtcNow.ToString('o')
              result = $result
              runner = [ordered]@{
                os = [Environment]::OSVersion.VersionString
                image = $env:ImageOS
                image_version = $env:ImageVersion
              }
              candidate = [ordered]@{
                sha256 = $candidateHash
                bytes = [int64]$candidate.Length
                expected_sha256 = $expectedSha
                expected_bytes = $expectedBytes
              }
              before = [ordered]@{
                am_service_enabled = [bool]$beforeStatus.AMServiceEnabled
                antivirus_enabled = [bool]$beforeStatus.AntivirusEnabled
                realtime_protection_enabled = [bool]$beforeStatus.RealTimeProtectionEnabled
                behavior_monitor_enabled = [bool]$beforeStatus.BehaviorMonitorEnabled
                antispyware_enabled = [bool]$beforeStatus.AntispywareEnabled
              }
              enable_attempts = @($attempts)
              after = [ordered]@{
                am_service_enabled = [bool]$afterStatus.AMServiceEnabled
                antivirus_enabled = [bool]$afterStatus.AntivirusEnabled
                realtime_protection_enabled = [bool]$afterStatus.RealTimeProtectionEnabled
                behavior_monitor_enabled = [bool]$afterStatus.BehaviorMonitorEnabled
                antispyware_enabled = [bool]$afterStatus.AntispywareEnabled
              }
              defender_report = $defenderReport
              scan_exception = $scanException
            }
          } finally {
            Invoke-PreferenceChange "DisableRealtimeMonitoring=$([bool]$beforePreference.DisableRealtimeMonitoring)" { Set-MpPreference -DisableRealtimeMonitoring ([bool]$beforePreference.DisableRealtimeMonitoring) -ErrorAction Stop } $restoreAttempts
            Invoke-PreferenceChange "DisableBehaviorMonitoring=$([bool]$beforePreference.DisableBehaviorMonitoring)" { Set-MpPreference -DisableBehaviorMonitoring ([bool]$beforePreference.DisableBehaviorMonitoring) -ErrorAction Stop } $restoreAttempts
            Invoke-PreferenceChange "DisableIOAVProtection=$([bool]$beforePreference.DisableIOAVProtection)" { Set-MpPreference -DisableIOAVProtection ([bool]$beforePreference.DisableIOAVProtection) -ErrorAction Stop } $restoreAttempts
            Invoke-PreferenceChange "DisableScriptScanning=$([bool]$beforePreference.DisableScriptScanning)" { Set-MpPreference -DisableScriptScanning ([bool]$beforePreference.DisableScriptScanning) -ErrorAction Stop } $restoreAttempts
            if ($null -ne $summary) {
              $summary.restore_attempts = @($restoreAttempts)
              $json = $summary | ConvertTo-Json -Depth 12
              $json | Set-Content -LiteralPath $summaryPath -Encoding UTF8
              $json
              Write-Host "DEFENDER_HOSTED_ACTIVATION_RESULT=$($summary.result)"
              if ([string]$summary.result -eq 'FAIL') { throw 'Hosted Defender activation/custom-scan probe failed.' }
            }
          }
      - name: Upload Defender hosted activation probe
        if: always() && runner.os == 'Windows' && github.head_ref == 'defender-hosted-activation-probe'
        uses: actions/upload-artifact@v4
        with:
          name: SearchTool-defender-hosted-activation-probe
          path: ${{ runner.temp }}/SearchToolDefenderHostedActivationProbe/summary.json
          if-no-files-found: warn
      - name: Registry rollback snapshot self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\install.ps1 -RegistrySnapshotSelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Registry rollback snapshot self-test failed with exit code $LASTEXITCODE."
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\release\search-tool.exe status
          .\target\release\search-tool.exe version
          .\target\release\search-tool-bench.exe 100000
      - name: NTFS + USN integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\windows-integration.ps1
      - name: USN journal reset recovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\journal-reset-recovery.ps1
      - name: Installer rollback fault matrix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-fault-matrix.ps1 -Root "$env:RUNNER_TEMP\SearchToolInstallFaultMatrix" -EvidencePath "$env:RUNNER_TEMP\install-fault-matrix.json"
      - name: Package Windows portable release
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1 -OutputDir .\dist
      - name: Verify packaged Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-package.ps1 -Package .\dist\SearchTool-Windows-x64.zip
      - name: Portable installer smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-smoke.ps1 -Package .\dist\SearchTool-Windows-x64.zip
      - name: Pristine default-path validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\pristine-validation.ps1 -Package .\dist\SearchTool-Windows-x64.zip -OutputJson "$env:RUNNER_TEMP\pristine-validation.json"
      - name: Upload pristine validation evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: SearchTool-pristine-validation
          path: ${{ runner.temp }}/pristine-validation.json
          if-no-files-found: warn
      - name: Upload Windows portable release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SearchTool-Windows-x64
          path: dist/SearchTool-Windows-x64.zip
          if-no-files-found: error
      - name: CLI smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          ./target/release/search-tool status
          ./target/release/search-tool version
          ./target/release/search-tool-bench 100000
